name: ci

# Pushes to a feature branch are covered by the pull_request trigger, so limiting push to the
# merge targets halves the Actions minutes a PR costs without losing any coverage.
# workflow_dispatch is the manual escape hatch for a branch that has no PR yet.
on:
  push:
    branches:
      - main
      - 'MOODLE_*_STABLE'
  pull_request:
  workflow_dispatch:

# Supersede a run when new commits arrive on the same pull request: pushing
# three fixes in a row otherwise leaves three full pipelines running to the end.
# Never on main - each merge there is the only run its commit will ever get, and
# a second merge landing quickly must not cancel the first one's verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # One branch per Moodle version: this branch supports 4.5 only ($plugin->supported =
  # [405, 405]), so it has one job, with the full PHP x DB matrix; the other versions live on main (5.3) and the
  # other MOODLE_*_STABLE branches.
  # PHPUnit and Behat run on every runtime leg.
  ci-405:
    name: Moodle 4.05
    uses: moodle-an-hochschulen/moodle-workflows/.github/workflows/moodle-plugin-ci.yml@main
    with:
      moodle-core-branch: MOODLE_405_STABLE
