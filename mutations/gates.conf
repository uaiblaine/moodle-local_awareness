# Mutation spec of local_awareness: each guard added for the plugins directory guidelines, and the
# test that must redden without it. Run from the main session (fleet rule 6), on both database
# families:
#   mdl mutate moodle-local_awareness-501 moodle-local_awareness-501/mutations/gates.conf --fast --branch MOODLE_501_STABLE --db pgsql
#   mdl mutate moodle-local_awareness-501 moodle-local_awareness-501/mutations/gates.conf --fast --branch MOODLE_501_STABLE --db mariadb
#
# tag | file | perl script

