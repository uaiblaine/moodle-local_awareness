# Mutation spec of local_awareness: each guard added for the second security audit of November 2026
# (2026-11-25), and the test that must redden without it. Run from the main session (fleet rule 6),
# on both database families:
#   mdl mutate moodle-local_awareness moodle-local_awareness/mutations/security_2026_11b.conf --fast --branch MOODLE_503_STABLE --db pgsql
#   mdl mutate moodle-local_awareness moodle-local_awareness/mutations/security_2026_11b.conf --fast --branch MOODLE_503_STABLE --db mariadb
#
# tag | file | perl script


